{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>borrowed Books</title>
</head>

<body>

    <header>
        <h1>Borrowed books</h1>


        <nav>
            <a href="{% url 'home' %}">Home</a> |
            <a href="{% url 'search' %}">Search</a> |
            <a href="{% url 'borrowed_books' %}">My Books</a> |
            <a href="{% url 'logout' %}">Logout</a>
        </nav>
    </header>

    <main>
        <h2>My Books</h2>
        <div class="borrowed-header"><a href="{% url 'books' %}" class="btn browse-btn">Browse Books</a></div>
        <div class="borrowed-books">

    {% for book in books %}

        <div class="book-card">

            <div class="book-cover">

                <img src="{{ book.image }}"
                     style="width:100%;
                            height:100%;
                            object-fit:cover;">

            </div>

            <div class="book-content">

                <div class="book-title">
                    {{ book.title }}
                </div>

                <div class="book-author">
                    {{ book.author }}
                </div>

                <div>
                    📅 {{ book.year }}

                    <span class="status borrowed">
                        Borrowed
                    </span>
                </div>

                <div class="book-actions">

                    <button
                    class="unborrow-btn"
                    onclick="unborrowBook({{ book.id }})">

                    Unborrow

                    </button>

                    <button
                    class="details-btn"
                    onclick="goToDetails({{ book.id }})">

                    Details

                    </button>

                </div>

            </div>

        </div>

    {% empty %}

        <h3>No borrowed books.</h3>

    {% endfor %}

</div>

        </div>
    </main>

    <footer>
        <form action="https://formsubmit.co/be136af79a36ee1f98093677271e4c0c" method="POST">
            <div>
                <h2>Get in Touch</h2>
            </div>
            <div class="form-row">
                <input class="contact" type="text" name="name" placeholder="Your Name" required>
                <input class="contact" type="email" name="email" placeholder="Your Email" required>
            </div>
            <textarea class="contact" name="massege" placeholder="Your Massege"></textarea><br><br>
            <button class="btn" type="submit">Submit</button>
            <button class="btn" type="reset">Reset</button>
        </form>

        <p>Copyright @ 2026 All Rights</p>
    </footer>
    <script src="{% static 'js/books.js' %}"></script>
</body>

</html>
